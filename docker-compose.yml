services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      APP_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      AI_WORKER_TTL_SECONDS: ${AI_WORKER_TTL_SECONDS:-30}
      AI_LATEST_RESULT_TTL_SECONDS: ${AI_LATEST_RESULT_TTL_SECONDS:-3600}
      AI_WORKER_INTERNAL_URL: http://ai-worker:8080
      EZVIZ_APP_KEY: ${EZVIZ_APP_KEY:-}
      EZVIZ_APP_SECRET: ${EZVIZ_APP_SECRET:-}
      EZVIZ_API_BASE_URL: ${EZVIZ_API_BASE_URL:-https://open.ys7.com}
      EZVIZ_BROWSER_PLAYBACK_ENABLED: ${EZVIZ_BROWSER_PLAYBACK_ENABLED:-false}
      EZVIZ_EZOPEN_DOMAIN: ${EZVIZ_EZOPEN_DOMAIN:-open.ys7.com}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_INTERNAL_URL: http://backend:8000
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      AI_WORKER_ID: ${AI_WORKER_ID:-careshield-worker-1}
      AI_WORKER_VERSION: ${AI_WORKER_VERSION:-0.5.0}
      AI_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${AI_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      FALL_DETECTION_ENABLED: ${FALL_DETECTION_ENABLED:-true}
      AI_DEVICE: ${AI_DEVICE:-auto}
      FALL_DEVICE_SERIAL: ${FALL_DEVICE_SERIAL:-}
      FALL_CHANNEL_NO: ${FALL_CHANNEL_NO:-1}
      FALL_MODEL_PATH: /models/${FALL_MODEL_NAME:-yolo26m-pose.pt}
      FALL_MODEL_NAME: ${FALL_MODEL_NAME:-yolo26m-pose.pt}
      FALL_PERSON_MODEL_PATH: /models/${FALL_PERSON_MODEL_NAME:-yolo26s.pt}
      FALL_PERSON_MODEL_NAME: ${FALL_PERSON_MODEL_NAME:-yolo26s.pt}
      FALL_CLASSIFIER_MODEL_PATH: /models/fall_detection/${FALL_CLASSIFIER_MODEL_FILE:-stgcn-extend-real440.pth}
      FALL_CLASSIFIER_MODEL_NAME: ${FALL_CLASSIFIER_MODEL_NAME:-stgcn-extend-real440}
      FALL_INPUT_FPS: ${FALL_INPUT_FPS:-15}
      FALL_INPUT_SIZE: ${FALL_INPUT_SIZE:-960}
      FALL_POSE_CONFIDENCE: ${FALL_POSE_CONFIDENCE:-0.20}
      FALL_PERSON_CONFIDENCE: ${FALL_PERSON_CONFIDENCE:-0.20}
      FALL_MIN_KEYPOINT_CONFIDENCE: ${FALL_MIN_KEYPOINT_CONFIDENCE:-0.35}
      FALL_MIN_SEQUENCE_VALID_RATIO: ${FALL_MIN_SEQUENCE_VALID_RATIO:-0.80}
      FALL_OBSERVATION_WINDOW_SECONDS: ${FALL_OBSERVATION_WINDOW_SECONDS:-2.0}
      FALL_RESULT_HEARTBEAT_SECONDS: ${FALL_RESULT_HEARTBEAT_SECONDS:-1}
      FALL_CLASSIFIER_INFERENCE_HZ: ${FALL_CLASSIFIER_INFERENCE_HZ:-2}
      FALL_STGCN_SUSPECTED_THRESHOLD: ${FALL_STGCN_SUSPECTED_THRESHOLD:-0.60}
      FALL_STGCN_FALLEN_THRESHOLD: ${FALL_STGCN_FALLEN_THRESHOLD:-0.80}
      FALL_STGCN_CONFIRMATION_WINDOWS: ${FALL_STGCN_CONFIRMATION_WINDOWS:-1}
      FALL_STGCN_RECOVERY_WINDOWS: ${FALL_STGCN_RECOVERY_WINDOWS:-5}
      FALL_TRACKING_MINIMUM_IOU: ${FALL_TRACKING_MINIMUM_IOU:-0.25}
      FALL_TRACKING_MAXIMUM_MISSING_FRAMES: ${FALL_TRACKING_MAXIMUM_MISSING_FRAMES:-30}
      FALL_TRACKING_MAXIMUM_CENTER_DISTANCE: ${FALL_TRACKING_MAXIMUM_CENTER_DISTANCE:-0.45}
    gpus: all
    volumes:
      - ./models:/models
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
