services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      APP_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      AI_WORKER_TTL_SECONDS: ${AI_WORKER_TTL_SECONDS:-30}
      AI_LATEST_RESULT_TTL_SECONDS: ${AI_LATEST_RESULT_TTL_SECONDS:-3600}
      AI_WORKER_INTERNAL_URL: http://ai-worker:8080
      FALL_RISK_WORKER_INTERNAL_URL: http://fall-risk-worker:8090
      EZVIZ_APP_KEY: ${EZVIZ_APP_KEY:-}
      EZVIZ_APP_SECRET: ${EZVIZ_APP_SECRET:-}
      EZVIZ_API_BASE_URL: ${EZVIZ_API_BASE_URL:-https://open.ys7.com}
      EZVIZ_BROWSER_PLAYBACK_ENABLED: ${EZVIZ_BROWSER_PLAYBACK_ENABLED:-false}
      EZVIZ_EZOPEN_DOMAIN: ${EZVIZ_EZOPEN_DOMAIN:-open.ys7.com}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_INTERNAL_URL: http://backend:8000
      MEDIA_RELAY_INTERNAL_URL: http://media-relay:8095
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      AI_WORKER_ID: ${AI_WORKER_ID:-careshield-worker-1}
      AI_WORKER_VERSION: ${AI_WORKER_VERSION:-0.5.0}
      AI_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${AI_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      FALL_DETECTION_ENABLED: ${FALL_DETECTION_ENABLED:-true}
      AI_DEVICE: ${AI_DEVICE:-auto}
      FALL_DEVICE_SERIAL: ${FALL_DEVICE_SERIAL:-}
      FALL_CHANNEL_NO: ${FALL_CHANNEL_NO:-1}
      FALL_MODEL_PATH: /models/${FALL_MODEL_NAME:-yolo26m-pose.pt}
      FALL_MODEL_NAME: ${FALL_MODEL_NAME:-yolo26m-pose.pt}
      FALL_PERSON_MODEL_PATH: /models/${FALL_PERSON_MODEL_NAME:-yolo26s.pt}
      FALL_PERSON_MODEL_NAME: ${FALL_PERSON_MODEL_NAME:-yolo26s.pt}
      FALL_CLASSIFIER_MODEL_PATH: /models/fall_detection/${FALL_CLASSIFIER_MODEL_FILE:-stgcn-extend-real440.pth}
      FALL_CLASSIFIER_MODEL_NAME: ${FALL_CLASSIFIER_MODEL_NAME:-stgcn-extend-real440}
      FALL_INPUT_FPS: ${FALL_INPUT_FPS:-15}
      FALL_INPUT_SIZE: ${FALL_INPUT_SIZE:-960}
      FALL_POSE_CONFIDENCE: ${FALL_POSE_CONFIDENCE:-0.20}
      FALL_PERSON_CONFIDENCE: ${FALL_PERSON_CONFIDENCE:-0.20}
      FALL_MIN_KEYPOINT_CONFIDENCE: ${FALL_MIN_KEYPOINT_CONFIDENCE:-0.35}
      FALL_MIN_SEQUENCE_VALID_RATIO: ${FALL_MIN_SEQUENCE_VALID_RATIO:-0.80}
      FALL_OBSERVATION_WINDOW_SECONDS: ${FALL_OBSERVATION_WINDOW_SECONDS:-2.0}
      FALL_RESULT_HEARTBEAT_SECONDS: ${FALL_RESULT_HEARTBEAT_SECONDS:-1}
      FALL_CLASSIFIER_INFERENCE_HZ: ${FALL_CLASSIFIER_INFERENCE_HZ:-2}
      FALL_STGCN_SUSPECTED_THRESHOLD: ${FALL_STGCN_SUSPECTED_THRESHOLD:-0.45}
      FALL_STGCN_FALLEN_THRESHOLD: ${FALL_STGCN_FALLEN_THRESHOLD:-0.65}
      FALL_STGCN_CONFIRMATION_WINDOWS: ${FALL_STGCN_CONFIRMATION_WINDOWS:-1}
      FALL_STGCN_RECOVERY_WINDOWS: ${FALL_STGCN_RECOVERY_WINDOWS:-5}
      FALL_ALERT_MINIMUM_VISIBLE_SECONDS: ${FALL_ALERT_MINIMUM_VISIBLE_SECONDS:-15}
      FALL_TRACKING_MINIMUM_IOU: ${FALL_TRACKING_MINIMUM_IOU:-0.25}
      FALL_TRACKING_MAXIMUM_MISSING_FRAMES: ${FALL_TRACKING_MAXIMUM_MISSING_FRAMES:-30}
      FALL_TRACKING_MAXIMUM_CENTER_DISTANCE: ${FALL_TRACKING_MAXIMUM_CENTER_DISTANCE:-0.45}
    gpus: all
    volumes:
      - ./models:/models
    depends_on:
      backend:
        condition: service_healthy
      media-relay:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  fall-risk-worker:
    build:
      context: .
      dockerfile: fall-risk-worker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      MEDIA_RELAY_INTERNAL_URL: http://media-relay:8095
      MEDIA_RELAY_PLAYBACK_URL: http://media-server:9996
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      FALL_RISK_WORKER_ID: ${FALL_RISK_WORKER_ID:-careshield-fall-risk-1}
      FALL_RISK_WORKER_VERSION: ${FALL_RISK_WORKER_VERSION:-0.6.1}
      AI_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${AI_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      FALL_RISK_DATA_ROOT: /data/fall-risk
      FALL_RISK_CHANNEL_NO: ${FALL_RISK_CHANNEL_NO:-1}
      VISIONMD_PYTHON: /opt/visionmd-env/bin/python
      VISIONMD_RUNNER: /opt/visionmd-app/run_rgb_to_28.py
      VISIONMD_PROJECT_ROOT: /opt/visionmd-app
      VISIONMD_METRABS_MODEL_DIR: /models/fall-risk/visionmd/metrabs_local_s
      TF_USE_LEGACY_KERAS: "1"
      GVHMR_PYTHON: /runtime/gvhmr-env/bin/python
      GVHMR_RUNNER: /opt/careshield/gvhmr/run_gvhmr_world.py
      GVHMR_PROJECT_ROOT: /opt/gvhmr
      GVHMR_CHECKPOINTS_ROOT: /models/fall-risk/gvhmr/official-checkpoints
      GVHMR_BODY_MODELS_ROOT: /models/fall-risk/gvhmr/body_models
      MOTIONCLIP_INTERNAL_URL: http://motionclip-worker:8091
      KINECAL_INTERNAL_URL: http://kinecal-risk-worker:8092
      FALL_RISK_LLM_EXPLANATION_ENABLED: ${FALL_RISK_LLM_EXPLANATION_ENABLED:-true}
      FALL_RISK_OLLAMA_BASE_URL: http://ollama:11434
      FALL_RISK_OLLAMA_MODEL: ${FALL_RISK_OLLAMA_MODEL:-qwen3:4b}
      FALL_RISK_LLM_TIMEOUT_SECONDS: ${FALL_RISK_LLM_TIMEOUT_SECONDS:-12}
    volumes:
      - ./models/fall-risk:/models/fall-risk:ro
      - ./models/fall-risk/gvhmr/official-checkpoints:/opt/gvhmr/inputs/checkpoints:ro
      - ./models/fall-risk/gvhmr/body_models:/opt/gvhmr/inputs/checkpoints/body_models:ro
      - ./runtime/gvhmr-env:/runtime/gvhmr-env:ro
      - fall-risk-data:/data/fall-risk
    gpus: all
    depends_on:
      backend:
        condition: service_healthy
      media-relay:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  motionclip-worker:
    build:
      context: .
      dockerfile: motionclip-worker/Dockerfile
    environment:
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      FALL_RISK_DATA_ROOT: /data/fall-risk
      MOTIONCLIP_CHECKPOINT: /models/motionclip/checkpoint_best.pth.tar
      MOTIONCLIP_PROFILE: ${MOTIONCLIP_PROFILE:-carepd_four_dataset_explainable}
      MOTIONCLIP_DEVICE: ${MOTIONCLIP_DEVICE:-auto}
      MOTIONCLIP_RISK_THRESHOLDS: /opt/careshield/motionclip-config/carepd_encoder_only_risk_thresholds.json
    volumes:
      - ${MOTIONCLIP_CHECKPOINT_PATH:-./models/fall-risk/motionclip/checkpoint_best.pth.tar}:/models/motionclip/checkpoint_best.pth.tar:ro
      - ${MOTIONCLIP_RUNTIME_ROOT:-./runtime/motionclip-env}:/runtime/motionclip:ro
      - fall-risk-data:/data/fall-risk:ro
    gpus: all
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8091/health'))['ready']",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  kinecal-risk-worker:
    build:
      context: .
      dockerfile: kinecal-risk-worker/Dockerfile
    environment:
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      FALL_RISK_DATA_ROOT: /data/fall-risk
      KINECAL_CHECKPOINT: /models/kinecal/kinecal_walk_v2_best.pt
      KINECAL_PROFILE: /opt/careshield/kinecal-config/kinecal_walk_v2.json
      KINECAL_DEVICE: ${KINECAL_DEVICE:-auto}
    volumes:
      - ${KINECAL_CHECKPOINT_PATH:-./models/fall-risk/kinecal/kinecal_walk_v2_best.pt}:/models/kinecal/kinecal_walk_v2_best.pt:ro
      - ${KINECAL_RUNTIME_ROOT:-./runtime/kinecal-env}:/runtime/kinecal:ro
      - fall-risk-data:/data/fall-risk:ro
    gpus: all
    healthcheck:
      test:
        [
          "CMD",
          "/runtime/kinecal/bin/python",
          "-c",
          "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8092/health'))['ready']",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  fraud-worker:
    build:
      context: .
      dockerfile: fraud-worker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      MEDIA_RELAY_INTERNAL_URL: http://media-relay:8095
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      FRAUD_WORKER_ID: ${FRAUD_WORKER_ID:-careshield-fraud-1}
      FRAUD_WORKER_VERSION: ${FRAUD_WORKER_VERSION:-0.7.0}
      AI_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${AI_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      FRAUD_DETECTION_ENABLED: ${FRAUD_DETECTION_ENABLED:-true}
      FRAUD_ASR_PROVIDER: ${FRAUD_ASR_PROVIDER:-faster_whisper}
      FRAUD_ASR_MODEL_PATH: /models/fraud/whisper-model
      FRAUD_ASR_DEVICE: ${FRAUD_ASR_DEVICE:-cpu}
      FRAUD_ASR_COMPUTE_TYPE: ${FRAUD_ASR_COMPUTE_TYPE:-int8}
      FRAUD_ASR_CPU_THREADS: ${FRAUD_ASR_CPU_THREADS:-2}
      FRAUD_ASR_NUM_WORKERS: ${FRAUD_ASR_NUM_WORKERS:-1}
      FRAUD_ASR_MINIMUM_CONFIDENCE: ${FRAUD_ASR_MINIMUM_CONFIDENCE:-0.50}
      FRAUD_AUDIO_RMS_THRESHOLD: ${FRAUD_AUDIO_RMS_THRESHOLD:-180}
      FRAUD_ENDPOINT_SILENCE_SECONDS: ${FRAUD_ENDPOINT_SILENCE_SECONDS:-0.7}
      FRAUD_MINIMUM_UTTERANCE_SECONDS: ${FRAUD_MINIMUM_UTTERANCE_SECONDS:-0.5}
      FRAUD_MAXIMUM_UTTERANCE_SECONDS: ${FRAUD_MAXIMUM_UTTERANCE_SECONDS:-15}
      FRAUD_LLM_ENABLED: ${FRAUD_LLM_ENABLED:-true}
      FRAUD_OLLAMA_BASE_URL: http://ollama:11434
      FRAUD_OLLAMA_MODEL: ${FRAUD_OLLAMA_MODEL:-qwen3:4b}
      FRAUD_TRANSCRIPT_RETENTION_SECONDS: ${FRAUD_TRANSCRIPT_RETENTION_SECONDS:-60}
    volumes:
      - ${FRAUD_ASR_MODEL_HOST_PATH:-./models/fraud/whisper-model}:/models/fraud/whisper-model:ro
    depends_on:
      backend:
        condition: service_healthy
      media-relay:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8092/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.11
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  media-server:
    image: bluenviron/mediamtx:1.20.0
    volumes:
      - ./infra/media/mediamtx.yml:/mediamtx.yml:ro
      - media-recordings:/recordings
    restart: unless-stopped

  media-relay:
    build:
      context: .
      dockerfile: media-relay/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      AI_WORKER_SHARED_TOKEN: ${AI_WORKER_SHARED_TOKEN:?Set AI_WORKER_SHARED_TOKEN in .env}
      MEDIA_RELAY_CHANNEL_NO: ${FALL_CHANNEL_NO:-1}
      MEDIA_RELAY_PUBLISH_URL: rtsp://media-server:8554/careshield
      MEDIA_RELAY_READ_URL: rtsp://media-server:8554/careshield
      MEDIA_RELAY_MEDIA_SERVER_API_URL: http://media-server:9997
      MEDIA_RELAY_RECONNECT_SECONDS: 3
    depends_on:
      backend:
        condition: service_healthy
      media-server:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  fall-risk-data:
  media-recordings:
  ollama_data:
